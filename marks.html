<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Entry</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <h1>Student Performance Tracking System</h1>

    <h2>Student Marks Entry</h2>

    <form action="/add_marks" method="POST">

        <label>Student USN:</label><br>
        <input type="text" name="usn" placeholder="Enter student USN" required><br><br>

        <label>Subject Name:</label><br>
        <input type="text" name="subject" placeholder="Enter subject name" required><br><br>

        <label>Marks:</label><br>
        <input type="number" name="marks" min="0" max="100" placeholder="Enter marks (0-100)" required><br><br>

        <button type="submit">Save Marks</button>

    </form>

    <a href="/">Go Back</a>

</body>
</html>
