<!DOCTYPE html>
<html>
<head>
    <title>AI Performance Prediction</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            text-align: center;
            padding: 30px;
        }
        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #ccc;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        h2 {
            color: #2563eb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Performance Prediction</h2>

    <form method="POST">
        <input type="text" name="usn"
               placeholder="Enter Student USN" required>

        <input type="number" name="marks"
               placeholder="Enter Marks (0-100)"
               min="0" max="100" required>

        <input type="number" name="attendance"
               placeholder="Enter Attendance (%)"
               min="0" max="100" required>

        <button type="submit">Predict Performance</button>
    </form>

    {% if prediction %}
        <h3>Prediction Result</h3>
        <p>USN: {{ usn }}</p>
        <p>Marks: {{ marks }}</p>
        <p>Attendance: {{ attendance }}%</p>
        <h2>{{ prediction }}</h2>
    {% endif %}

    <br>
    <a href="/">Go Home</a>
</div>

</body>
</html>
