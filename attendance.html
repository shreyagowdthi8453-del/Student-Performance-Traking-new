<!DOCTYPE html>
<html>
<head>
    <title>Attendance Management</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <h1>Student Performance Tracking System</h1>

    <h2>Attendance Entry</h2>

    <form action="/add_attendance" method="POST">

        <label>Student USN:</label><br>
        <input type="text" name="usn" placeholder="Enter USN" required><br><br>

        <label>Total Classes:</label><br>
        <input type="number" name="total_classes" min="1" placeholder="Enter total classes" required><br><br>

        <label>Attended Classes:</label><br>
        <input type="number" name="attended_classes" min="0" placeholder="Enter attended classes" required><br><br>

        <button type="submit">Save Attendance</button>

    </form>

    <a href="/">Go Back</a>

</body>
</html>
